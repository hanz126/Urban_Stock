<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>UrbanStock</h2>
      <p>Sistema de Gestión y POS</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input 
          id="correo" 
          type="email" 
          formControlName="correo" 
          placeholder="tucorreo@urbanstock.com"
        />
        <div *ngIf="loginForm.get('correo')?.invalid && loginForm.get('correo')?.touched" class="error-text">
          Ingrese un correo electrónico válido.
        </div>
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <div class="password-wrapper">
          <input 
            id="contrasena" 
            [type]="showPassword ? 'text' : 'password'" 
            formControlName="contrasena" 
            placeholder="••••••••"
          />
          <button 
            type="button" 
            class="toggle-password-btn" 
            (click)="togglePassword()" 
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <!-- Ojo abierto (cuando está oculta la contraseña) -->
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>

            <!-- Ojo tachado (cuando es visible la contraseña) -->
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div *ngIf="loginForm.get('contrasena')?.invalid && loginForm.get('contrasena')?.touched" class="error-text">
          La contraseña debe tener al menos 6 caracteres.
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert-error">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loading" class="btn-submit">
        <span *ngIf="!loading">Ingresar al Sistema</span>
        <span *ngIf="loading">Ingresando...</span>
      </button>

    </form>
  </div>
</div>
